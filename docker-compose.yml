# AutoTest - dong goi chay tren may that cua chu du an.
# Chay: cp .env.example .env && docker compose up -d
# Cong: control http://localhost:3100 - orchestrator http://localhost:3101
# DB noi bo chi nghe trong mang compose, khong publish cong ra ngoai (S1.1).

services:
  control:
    build:
      context: .
      dockerfile: apps/control/Dockerfile
    environment:
      ORCHESTRATOR_URL: http://orchestrator:3101
      PORT: "3100"
    ports:
      - "${CONTROL_PORT:-3100}:3100"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3100/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
      PORT: "3101"
      DATABASE_URL: postgres://${POSTGRES_USER:-autotest}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-autotest}
      TARGET_BASE_URL: ${TARGET_BASE_URL:-}
      TARGET_ALLOWLIST: ${TARGET_ALLOWLIST:-}
      TEST_TENANT: ${TEST_TENANT:-}
      ROLE_BENH_NHAN_USERNAME: ${ROLE_BENH_NHAN_USERNAME:-}
      ROLE_BENH_NHAN_PASSWORD: ${ROLE_BENH_NHAN_PASSWORD:-}
      ROLE_LE_TAN_USERNAME: ${ROLE_LE_TAN_USERNAME:-}
      ROLE_LE_TAN_PASSWORD: ${ROLE_LE_TAN_PASSWORD:-}
      ROLE_BAC_SI_USERNAME: ${ROLE_BAC_SI_USERNAME:-}
      ROLE_BAC_SI_PASSWORD: ${ROLE_BAC_SI_PASSWORD:-}
      ROLE_THU_NGAN_USERNAME: ${ROLE_THU_NGAN_USERNAME:-}
      ROLE_THU_NGAN_PASSWORD: ${ROLE_THU_NGAN_PASSWORD:-}
      ROLE_QUAN_LY_USERNAME: ${ROLE_QUAN_LY_USERNAME:-}
      ROLE_QUAN_LY_PASSWORD: ${ROLE_QUAN_LY_PASSWORD:-}
      CHANNELS_SANDBOX: ${CHANNELS_SANDBOX:-}
      # S5.3: duong dan health de doc co sandbox kenh ngoai tu dich
      CRM_HEALTH_PATH: ${CRM_HEALTH_PATH:-}
      # S5.2: hang doi lan chay + dung an toan
      MAX_PARALLEL_SESSIONS: ${MAX_PARALLEL_SESSIONS:-5}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
      STOP_GRACE_MS: ${STOP_GRACE_MS:-30000}
      VIDEO_KEEP_ON_PASS: ${VIDEO_KEEP_ON_PASS:-false}
      # S2.4: don du lieu test tren CRM (mau duong + token tuy chon)
      CRM_CLEANUP_PATH_TEMPLATE: ${CRM_CLEANUP_PATH_TEMPLATE:-}
      CRM_CLEANUP_TOKEN: ${CRM_CLEANUP_TOKEN:-}
      # Epic 4: nguon so lieu kiem dem (API bao cao + DB chi doc cua dich)
      CRM_API_BAO_CAO_PATH: ${CRM_API_BAO_CAO_PATH:-}
      CRM_DB_READONLY_URL: ${CRM_DB_READONLY_URL:-}
      CRM_DB_SQL_TONG_DOANH_THU: ${CRM_DB_SQL_TONG_DOANH_THU:-}
      CRM_DB_SQL_DOANH_THU_KHACH: ${CRM_DB_SQL_DOANH_THU_KHACH:-}
      CRM_DB_SQL_SO_CHECK_IN: ${CRM_DB_SQL_SO_CHECK_IN:-}
      CRM_DB_SQL_SO_LICH_HEN: ${CRM_DB_SQL_SO_LICH_HEN:-}
      # Epic 3: noi voi worker (runner) + thu muc artifact dung chung
      RUNNER_URL: http://runner:3102
      ORCHESTRATOR_CALLBACK_URL: http://orchestrator:3101
      STREAM_GATEWAY_WS_URL: ws://localhost:${RUNNER_PORT:-3102}
      AUTOTEST_DATA_DIR: /data
    volumes:
      - run_data:/data
    ports:
      - "${ORCHESTRATOR_PORT:-3101}:3101"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3101/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  runner:
    build:
      context: .
      dockerfile: workers/runner/Dockerfile
    environment:
      ORCHESTRATOR_URL: http://orchestrator:3101
      RUNNER_PORT: "3102"
      RUNNER_READY_FILE: /tmp/runner-ready
    volumes:
      # Cung volume voi orchestrator: video/anh cua lan chay ghi o day.
      - run_data:/data
    ports:
      # Publish de trinh duyet cua nguoi dung noi WebSocket xem stream (S3.2).
      - "${RUNNER_PORT:-3102}:3102"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/runner-ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autotest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Can dat POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-autotest}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db_data:
  run_data:
