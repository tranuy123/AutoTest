<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Trang đích mẫu — tương đương trang CRM (spike S3.0)</title>
    <style>
      body { margin: 0; font-family: sans-serif; background: #f8fafc; color: #0f172a; }
      #clock { position: fixed; left: 10px; top: 10px; background: #000; z-index: 9999; }
      #anchor { position: fixed; left: 0; top: 0; width: 24px; height: 24px;
                background: #ff00ff; z-index: 9998; }
      .hop { margin: 110px 16px 16px; max-width: 900px; }
      #box { width: 60px; height: 24px; background: #2563eb; border-radius: 6px;
             animation: chay 6s linear infinite alternate; margin: 8px 0 16px; }
      @keyframes chay { from { transform: translateX(0); } to { transform: translateX(760px); } }
      label { display: block; margin: 10px 0 4px; font-weight: 600; }
      input, select { font-size: 16px; padding: 8px; width: 360px; }
      button { font-size: 16px; padding: 10px 18px; margin-top: 12px; background: #2563eb;
               color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
      li { margin: 4px 0; }
      .dai { height: 900px; }
    </style>
  </head>
  <body>
    <div id="anchor" aria-hidden="true"></div>
    <canvas id="clock" width="392" height="80"></canvas>
    <div class="hop">
      <h1>Đặt lịch khám — trang mẫu cho spike stream</h1>
      <div id="box" aria-hidden="true"></div>
      <form id="form-dat-lich">
        <label for="ten">Họ tên bệnh nhân (dữ liệu giả)</label>
        <input id="ten" name="ten" autocomplete="off" />
        <label for="sdt">Số điện thoại (dữ liệu giả)</label>
        <input id="sdt" name="sdt" autocomplete="off" />
        <label for="dichvu">Dịch vụ</label>
        <select id="dichvu" name="dichvu">
          <option>Khám tổng quát</option>
          <option>Khám chuyên khoa</option>
          <option>Tái khám</option>
        </select>
        <br />
        <button id="dat" type="submit">Đặt lịch</button>
      </form>
      <h2>Lịch hẹn đã tạo trong phiên</h2>
      <ul id="danh-sach"></ul>
      <div class="dai"></div>
      <p id="chan-trang">Cuối trang — dùng để cuộn khi đo.</p>
    </div>
    <script>
      // Dong ho khoi: ve bo dem ms ke tu luc tai trang, 9 chu so, o 3x5.
      window.__t0 = Date.now();
      window.__frames = 0;
      const BLOCKS = {
        "0": ["111", "101", "101", "101", "111"],
        "1": ["010", "010", "010", "010", "010"],
        "2": ["111", "001", "111", "100", "111"],
        "3": ["111", "001", "111", "001", "111"],
        "4": ["101", "101", "111", "001", "001"],
        "5": ["111", "100", "111", "001", "111"],
        "6": ["111", "100", "111", "101", "111"],
        "7": ["111", "001", "001", "010", "010"],
        "8": ["111", "101", "111", "101", "111"],
        "9": ["111", "101", "111", "001", "111"],
      };
      const cv = document.getElementById("clock");
      const ctx = cv.getContext("2d");
      const CELL = 12, STEP = 42, PADX = 10, PADY = 10;
      function veDongHo() {
        const value = Math.floor(Date.now() - window.__t0) % 1000000000;
        const text = String(value).padStart(9, "0");
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = "#fff";
        for (let d = 0; d < 9; d++) {
          const rows = BLOCKS[text[d]];
          for (let r = 0; r < 5; r++)
            for (let c = 0; c < 3; c++)
              if (rows[r][c] === "1")
                ctx.fillRect(PADX + d * STEP + c * CELL, PADY + r * CELL, CELL, CELL);
        }
        window.__frames++;
        requestAnimationFrame(veDongHo);
      }
      requestAnimationFrame(veDongHo);

      let stt = 0;
      document.getElementById("form-dat-lich").addEventListener("submit", (e) => {
        e.preventDefault();
        stt++;
        const li = document.createElement("li");
        li.textContent = "Lịch hẹn mẫu #" + stt + " — đã tạo lúc " + new Date().toLocaleTimeString("vi-VN");
        document.getElementById("danh-sach").appendChild(li);
      });
    </script>
  </body>
</html>
